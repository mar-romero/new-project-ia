name: Harness

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-harness:
    name: Validate Harness
    runs-on: ubuntu-latest
    env:
      CHECK_HARNESS_SELFTEST: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository harness
        shell: bash
        run: bash scripts/check-harness.sh

      - name: Reject placeholder commit subjects
        shell: bash
        run: bash scripts/check-commit-message.sh
